<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240"
     font-family="Montserrat, 'Segoe UI', Arial, sans-serif">
  <!--
    batmon5 overview screen, 320x240 landscape (ILI9341).
    Fonts: LVGL Montserrat 14 / 24 / 32 / 36
    (32 and 36 need CONFIG_LV_FONT_MONTSERRAT_32 / _36 in sdkconfig.defaults).
    Palette:
      background #101418   card #1B2128   track #2A323C
      label      #9AA5B1   value #FFFFFF
      battery ok #3DDC84   warn #FFB020   alarm #FF5A5A
      solar      #FFC940   fresh #3B9EFF  grey water #B39B77
  -->

  <!-- Screen background -->
  <rect width="320" height="240" fill="#101418"/>

  <!-- ===== Battery card ===== -->
  <rect x="6" y="6" width="152" height="228" rx="8" fill="#1B2128"/>

  <!-- title + battery icon -->
  <rect x="16" y="15" width="15" height="9" rx="1.5" fill="none" stroke="#9AA5B1" stroke-width="1.5"/>
  <rect x="31.5" y="17.5" width="2" height="4" fill="#9AA5B1"/>
  <rect x="18" y="17" width="9" height="5" fill="#3DDC84"/>
  <text x="40" y="24" font-size="14" font-weight="600" fill="#9AA5B1" letter-spacing="1">BATTERY</text>

  <!-- SOC arc: 270 degrees, open at the bottom (LVGL lv_arc default) -->
  <!-- circumference 2*pi*52 = 326.7; 270deg = 245.0; 78% of 270deg = 191.1 -->
  <circle cx="82" cy="86" r="52" fill="none" stroke="#2A323C" stroke-width="12"
          stroke-linecap="round" stroke-dasharray="245.0 326.7" transform="rotate(135 82 86)"/>
  <circle cx="82" cy="86" r="52" fill="none" stroke="#3DDC84" stroke-width="12"
          stroke-linecap="round" stroke-dasharray="191.1 326.7" transform="rotate(135 82 86)"/>
  <text x="82" y="99" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">78<tspan font-size="24" fill="#9AA5B1">%</tspan></text>
  <text x="82" y="138" font-size="14" font-weight="600" fill="#9AA5B1" text-anchor="middle">SOC</text>

  <!-- Power (green = charging, amber = discharging) -->
  <line x1="16" y1="148" x2="148" y2="148" stroke="#2A323C"/>
  <text x="16" y="166" font-size="14" fill="#9AA5B1">Power</text>
  <text x="148" y="197" font-size="32" font-weight="700" fill="#3DDC84" text-anchor="end">+124<tspan font-size="24" fill="#9AA5B1" dx="4">W</tspan></text>

  <!-- Voltage row (secondary, small) -->
  <line x1="16" y1="207" x2="148" y2="207" stroke="#2A323C"/>
  <text x="16" y="225" font-size="14" fill="#9AA5B1">Voltage</text>
  <text x="148" y="225" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="end">12.84<tspan fill="#9AA5B1" dx="2">V</tspan></text>

  <!-- ===== Solar card ===== -->
  <rect x="164" y="6" width="150" height="112" rx="8" fill="#1B2128"/>

  <!-- title + sun icon -->
  <g stroke="#FFC940" stroke-width="1.5" stroke-linecap="round">
    <circle cx="180" cy="19.5" r="3.5" fill="#FFC940"/>
    <line x1="180" y1="12" x2="180" y2="13.5"/>
    <line x1="180" y1="25.5" x2="180" y2="27"/>
    <line x1="172.5" y1="19.5" x2="174" y2="19.5"/>
    <line x1="186" y1="19.5" x2="187.5" y2="19.5"/>
    <line x1="174.7" y1="14.2" x2="175.8" y2="15.3"/>
    <line x1="184.2" y1="23.7" x2="185.3" y2="24.8"/>
    <line x1="174.7" y1="24.8" x2="175.8" y2="23.7"/>
    <line x1="184.2" y1="15.3" x2="185.3" y2="14.2"/>
  </g>
  <text x="194" y="24" font-size="14" font-weight="600" fill="#9AA5B1" letter-spacing="1">SOLAR</text>

  <!-- Power -->
  <line x1="174" y1="32" x2="304" y2="32" stroke="#2A323C"/>
  <text x="174" y="50" font-size="14" fill="#9AA5B1">Power</text>
  <text x="304" y="81" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="end">186<tspan font-size="24" fill="#9AA5B1" dx="4">W</tspan></text>

  <!-- Status row: Off / Bulk / Absorption / Float / Fault -->
  <line x1="174" y1="91" x2="304" y2="91" stroke="#2A323C"/>
  <text x="174" y="109" font-size="14" fill="#9AA5B1">Status</text>
  <text x="304" y="109" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="end">Bulk</text>

  <!-- ===== Water card ===== -->
  <rect x="164" y="124" width="150" height="110" rx="8" fill="#1B2128"/>

  <!-- title + droplet icon -->
  <path d="M180 129 C180 129 175 135 175 138.5 A5 5 0 0 0 185 138.5 C185 135 180 129 180 129 Z" fill="#3B9EFF"/>
  <text x="194" y="142" font-size="14" font-weight="600" fill="#9AA5B1" letter-spacing="1">WATER</text>

  <!-- Fresh (drinking) water: 65% -->
  <text x="174" y="166" font-size="14" fill="#9AA5B1">Fresh</text>
  <text x="304" y="166" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="end">65%</text>
  <rect x="174" y="172" width="130" height="12" rx="6" fill="#2A323C"/>
  <rect x="174" y="172" width="84.5" height="12" rx="6" fill="#3B9EFF"/>

  <!-- Grey water: 40% (turns amber > 75%, red > 90%) -->
  <text x="174" y="204" font-size="14" fill="#9AA5B1">Grey</text>
  <text x="304" y="204" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="end">40%</text>
  <rect x="174" y="210" width="130" height="12" rx="6" fill="#2A323C"/>
  <rect x="174" y="210" width="52" height="12" rx="6" fill="#B39B77"/>
</svg>
